name: Sync portfolio data from GitHub

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repos and build data files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repos=$(gh api users/mbaelde/repos --paginate -q '.[] | select(.archived == false)')

          echo "$repos" | jq -s '
            [.[] | select(.fork == false and .topics != null and (.topics | index("portfolio")))
             | {title: .name, description: .description, links: (
                 [{name: "GitHub", url: .html_url}]
                 + (if .homepage != null and .homepage != "" then [{name: (if (.homepage | test("pypi.org")) then "PyPI" else "Link" end), url: .homepage}] else [] end)
               )}]
          ' > data/portfolio.json

          echo "$repos" | jq -s '
            [.[] | select(.topics != null and (.topics | index("oss-contribution")))
             | {title: .name, description: .description, links: (
                 [{name: "GitHub", url: .html_url}]
                 + (if .homepage != null and .homepage != "" then [{name: "PR", url: .homepage}] else [] end)
               )}]
          ' > data/contributions.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/contributions.json
          git diff --cached --quiet || git commit -m "chore: sync portfolio data from GitHub"
          git push
